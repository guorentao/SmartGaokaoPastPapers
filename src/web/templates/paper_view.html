<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ paper.paper_title }} - 试卷</title>
    <style>{{ css | safe }}</style>
    <style>
        .toolbar a { color: #4b5563; text-decoration: none; border: 1px solid #c9cee0; background: #fff;
                     border-radius: 7px; padding: 6px 12px; font-size: 13px; }
        .toolbar a:hover { border-color: #5b6ee8; color: #5b6ee8; }
        .toolbar .tb-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    </style>
    {% include '_mathjax.html' %}
</head>
<body>
<div class="toolbar">
    <span class="brand"><a href="{{ base }}/papers">← 试卷下载中心</a>　{{ paper.paper_title }}</span>
    <span class="tb-right">
        <a href="{{ base }}/paper/{{ paper.paper_id }}?answer={{ 0 if show_answer else 1 }}">
            {{ '隐藏答案' if show_answer else '显示答案' }}
        </a>
        <a href="{{ base }}/paper/{{ paper.paper_id }}/download?fmt=docx&answer={{ 1 if show_answer else 0 }}">下载 Word</a>
        <a href="{{ base }}/paper/{{ paper.paper_id }}/download?fmt=html&answer={{ 1 if show_answer else 0 }}">下载网页</a>
        <a href="{{ base }}/paper/{{ paper.paper_id }}/download?fmt=md&answer={{ 1 if show_answer else 0 }}">Markdown</a>
        <a href="javascript:window.print()">🖨 打印</a>
    </span>
</div>
{{ body | safe }}
</body>
</html>
